[project]
name = "text-to-speech"
version = "0.1.0"
description = "A small text-to-speech model, built from scratch"
readme = "README.md"
authors = [
    { name = "HenryDashwood", email = "hcndashwood@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "audiotsm>=0.1.2",
    "coremltools>=9.1.dev1",
    "en-core-web-sm",
    "huggingface-hub>=1.32.0",
    "kokoro>=0.9.4",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pylibrb>=0.1.2",
    "pytsmod>=0.3.8",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[tool.ruff]
line-length = 120
extend-exclude = ["text_to_speech"]  # Generated by nbdev-export: lint the notebooks instead

[tool.ruff.lint]
extend-select = ["I"]

[tool.ty.environment]
python = "./.venv"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.nbdev]
lib_path = "text_to_speech"
put_version_in_init = false

[dependency-groups]
# Only appendix 193's XNNPACK section needs it, and it brings torchao, which warns on every import: uv sync --group xnnpack
xnnpack = ["executorch>=1.5.1"]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.5",
    "nbdev>=3.3.27",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]
